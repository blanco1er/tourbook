services:
  - type: web
    name: tourbook
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: QLOO_MODE
        value: live
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      # Planner model: any OpenAI-compatible endpoint. Gemini serves one; leave LLM_API_KEY empty to use the scripted planner.
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_API_KEY
        sync: false
      - key: RUNS_PER_IP_PER_DAY
        value: "30"
